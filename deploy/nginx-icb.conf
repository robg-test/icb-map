# /etc/nginx/sites-available/icb.bob-productions.dev
#
# Static vhost. Unlike weektasks there is no app to proxy to -- the WASM build is
# just files on disk. Keyed on server_name so the existing tasks vhost on the
# same droplet is untouched; nginx routes by Host/SNI and both share 80/443.
#
# Install this HTTP-only version FIRST, then run certbot; `certbot --nginx`
# rewrites this file to add the 443 block and the redirect.

server {
    listen 80;
    listen [::]:80;
    server_name icb.bob-productions.dev;

    root /var/www/icb;
    index index.html;

    # Let certbot answer the http-01 challenge.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # The payload is ~11 MB of mesh, land grid, bathymetry and fonts, which
    # gzips to under 2 MB. deploy.sh ships a .gz alongside every file, so nginx
    # serves the pre-compressed copy directly rather than compressing 11 MB on
    # every request. `gzip on` stays as the fallback for anything without a .gz.
    gzip_static on;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/tab-separated-values application/javascript application/wasm application/octet-stream;

    # Everything has a fixed filename (index.wasm, index.data), so a redeploy
    # reuses the same URLs. Revalidate rather than cache blindly, or a deploy
    # leaves people on a half-updated build until they hard-reload.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    # emscripten's .data bundle has no registered type; be explicit so it is not
    # sniffed as something else.
    location ~ \.data$ {
        add_header Cache-Control "no-cache";
        default_type application/octet-stream;
    }

    access_log /var/log/nginx/icb.access.log;
    error_log  /var/log/nginx/icb.error.log;
}
